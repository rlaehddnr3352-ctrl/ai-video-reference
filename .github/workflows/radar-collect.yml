name: radar-collect
# 매일 05:30 KST(20:30 UTC)에 유튜브 후보를 모아 radar/_cand.json 으로 커밋합니다.
# 필요한 것: 저장소 Settings → Secrets and variables → Actions → YT_API_KEY
on:
  schedule:
    - cron: "30 20 * * *"
    - cron: "7 21 * * *"   # 예비 실행(첫 실행이 빠졌을 때만 수집)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f radar/_cand.json ] && python3 -c "import json,sys,datetime as d;g=json.load(open('radar/_cand.json'))['generated'];t=d.datetime.fromisoformat(g).astimezone(d.timezone(d.timedelta(hours=9))).strftime('%Y-%m-%d');sys.exit(0 if t=='$today' else 1)"; then
            echo "오늘 후보가 이미 있어요. 건너뜀"; exit 0
          fi
          python3 radar/collect.py radar/_cand.json
      - name: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar/_cand.json
          git diff --cached --quiet && exit 0
          git commit -m "radar: candidates $(TZ=Asia/Seoul date +%F) [skip netlify]"
          git push
