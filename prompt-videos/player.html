<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}#gl{position:absolute;left:-9999px}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><canvas id="gl" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script type="module">
const q = new URLSearchParams(location.search), id = q.get("id");
await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "scenes/" + q.get("f") + ".js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
const sc = S[id], cv = document.getElementById("c"), g = cv.getContext("2d"); L.use(g);
await Promise.all(["900 40px 'Noto Sans CJK KR'", "700 40px 'Noto Sans CJK KR'", "500 40px 'Noto Sans CJK KR'", "900 40px 'Noto Serif CJK KR'", "800 40px Inter"].map(f => document.fonts.load(f, "가A")));
let draw3 = null;
if (sc.three) {
  const THREE = await import("./three.js"); const glc = document.getElementById("gl");
  const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true }); renderer.setSize(1080, 1920, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
  draw3 = await sc.setup(THREE, renderer, glc);
}
window.render = t => { g.save(); g.globalAlpha = 1; if (draw3) { draw3(t); g.drawImage(document.getElementById("gl"), 0, 0); } sc.draw(t); g.restore(); L.fadeIO(t, sc.dur, sc.fin ?? .3, sc.fout ?? .4); };
const oc = document.createElement("canvas"); oc.width = 720; oc.height = 1280; const og = oc.getContext("2d"); og.imageSmoothingQuality = "high";
window.frame = t => { render(t); og.drawImage(cv, 0, 0, 720, 1280); return oc.toDataURL("image/jpeg", .92); };
window.META = { id, dur: sc.dur, ...sc.meta };
window.READY = true;
</script></body></html>
